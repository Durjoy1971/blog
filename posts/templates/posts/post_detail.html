{% extends "base.html" %}
{% block title %}{{ post.post_title }}{% endblock %}
{%block content %}
<article class="post-detail">
    <h1>{{ post.post_title|default:"Untitled" }}</h1>
    <p>{{ post.post_content }}</p>
    <p>{{ post.published_date|date:"F d, Y" }}</p>
    <div style="margin-top: 20px;">
        <a href="{% url 'posts:post_edit' post.id %}" class="btn btn-primary">Edit Post</a>
        <a href="{% url 'posts:home' %}" class="btn btn-secondary">← Back to posts</a>
    </div>
</article>
{% endblock %}
